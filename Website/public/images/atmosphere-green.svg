<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="noiseGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.014" numOctaves="4" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.24
        0 0 0 0 0.84
        0 0 0 0 0.55
        0 0 0 0.85 0" result="tinted"/>
      <feGaussianBlur in="tinted" stdDeviation="20" result="soft"/>
      <feComposite in="soft" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="noiseGreen2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.024" numOctaves="3" seed="88" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.96
        0 0 0 0 0.65
        0 0 0 0 0.14
        0 0 0 0.4 0" result="tinted"/>
      <feGaussianBlur in="tinted" stdDeviation="30" result="soft"/>
      <feComposite in="soft" in2="SourceGraphic" operator="over"/>
    </filter>
    <radialGradient id="vignetteGreen" cx="55%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#0A0A0B" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0A0A0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#0A0A0B"/>
  <rect width="1920" height="1080" filter="url(#noiseGreen)" opacity="0.5"/>
  <rect width="1920" height="1080" filter="url(#noiseGreen2)" opacity="0.3"/>
  <rect width="1920" height="1080" fill="url(#vignetteGreen)"/>
</svg>
