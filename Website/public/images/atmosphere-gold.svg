<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="noiseGold" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.96
        0 0 0 0 0.65
        0 0 0 0 0.14
        0 0 0 0.9 0" result="tinted"/>
      <feGaussianBlur in="tinted" stdDeviation="18" result="soft"/>
      <feComposite in="soft" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="noiseGold2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.02" numOctaves="3" seed="42" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.24
        0 0 0 0 0.84
        0 0 0 0 0.55
        0 0 0 0.55 0" result="tinted"/>
      <feGaussianBlur in="tinted" stdDeviation="26" result="soft"/>
      <feComposite in="soft" in2="SourceGraphic" operator="over"/>
    </filter>
    <radialGradient id="vignetteGold" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0A0A0B" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0A0A0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#0A0A0B"/>
  <rect width="1920" height="1080" filter="url(#noiseGold)" opacity="0.55"/>
  <rect width="1920" height="1080" filter="url(#noiseGold2)" opacity="0.35"/>
  <rect width="1920" height="1080" fill="url(#vignetteGold)"/>
</svg>
